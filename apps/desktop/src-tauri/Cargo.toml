[package]
name = "fathom-desktop"
# 版本必须与单一版本源 fathom/__init__.py __version__ 一致（ISS-037）；
# scripts/check_version_consistency.sh 会拦截漂移。
version = "0.3.0"
description = "Fathom 桌面壳：菜单栏监控 + 主窗口"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "fathom_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]
