[package]
name = "disk-sentinel-desktop"
version = "0.2.0"
description = "容量哨兵桌面壳：菜单栏监控 + 主窗口"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "disk_sentinel_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]
