[package]
name = "fathom-desktop"
# 版本必须与单一版本源 fathom/__init__.py __version__ 一致（ISS-037）；
# scripts/check_version_consistency.sh 会拦截漂移。
version = "0.3.0"
license = "Apache-2.0"
description = "Fathom 桌面壳：菜单栏监控 + 主窗口"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ISS-068：测试用。glob 的匹配语义必须与 tauri-plugin-opener 所解析的
# 同一 crate 一致（upstream scope.rs 用 glob::Pattern::matches），故直接依赖
# 它而非自造匹配。区间与 Cargo.lock 既有 0.3.4 收敛，--locked 不受影响。
[dev-dependencies]
glob = "0.3"

[lib]
name = "fathom_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]
