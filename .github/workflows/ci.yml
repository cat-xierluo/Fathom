# Fathom CI（ISS-031：可复现测试与 CI 入口）
#
# 设计边界（对应任务卡与 v0.3 发行方案）：
# - 全部检查在 macOS 原生 runner 上运行：scanner 依赖 BSD du 的真实路径
#   行为；Apple Silicon（arm64）与 Intel（x86_64）各自独立 job 并显式
#   断言 uname -m，任一平台失败都会让整个 workflow 失败（无跳过、无
#   continue-on-error）。Intel 不用 arm64 交叉 target 冒充。
# - 依赖安装走分层锁定：packaging/requirements-dev.txt（直接依赖区间）+
#   packaging/constraints.txt（全闭包 == 精确版本）；Cargo 用 --locked --offline；
#   Python/Node/Rust/Playwright 版本号在 env 固定。
# - 无 secret、无签名、无 Release、无 artifact；第三方 action 一律固定
#   完整 commit SHA（SHA 取自 api.github.com git/ref/tags，2026-09-13）。
# - 不安装 launchd、不扫 HOME：pytest/夹具全部使用合成临时根
#   （tests/** 与 scripts/security_fixture_server.py 的既有隔离合同）。
#
# 未纳入（诚实声明）：Tauri CLI 版本固定——当前没有任何 CI 步骤调用
# tauri build（bundle.active=false），空固定只会制造假象；发行 CI
# （ISS-041）启用 tauri 构建时必须同步固定并复验。
# Chromium 仅在 arm64 job 驱动（JS 行为与架构无关）；Intel 侧 Python
# 环境由 pytest job 覆盖，浏览器栈 Intel 运行未验证。

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 已验证基线（ISS-113 后 800 passed = 781 + 19(ISS-113 应用更新无感化：
  # tests/test_auto_download_config.py 14——严格布尔 6 参数 + 双布尔接受/
  # 默认视图 true/落盘往返/排除集 env 覆盖透传/部分合并 + lib.rs 三钉子
  # （settings.json 读取、downloaded ready 事件与预下载接线、安装与重启
  # confirmed 门不回退）+ tests/test_api_config.py 5——PUT 往返 + 近亲 400×4)
  # ；前段推导见 scripts/ci_pytest.sh 头注（ISS-111 后 781 passed = 771 + 10(tests/test_api_permissions.py
  # 权限状态端点契约：FDA 探测三态 / notification 透传与未登记 / coverage
  # 引用与空库 / /api/status 的 app_version / 外站 Host 403)；771 = 753 + 13
  # (tests/test_release_gate.py
  # 发行门聚焦单测：必需 job 清单与 ci.yml 一致（6 实例逐字）/矩阵展开与
  # 缺 name 回退/解析 fail-closed 三反例/候选登记与制品指纹反例/manifest
  # 版本不符与非法 JSON/非 git 目录阻塞/--selftest 全绿)；753 = 739 + 14
  # (tests/test_upgrade_restore.py 安装后失败的真实旧 bundle 与数据恢复
  # 聚焦测试)；739 = 727 + 12(ISS-097
  # 升级事务聚焦测试)，727 = 720 + 7(ISS-096)，720 已含 ISS-030A/040B/040C/
  # 037/081/090/091 批次）：ISS-126 后 1051 pytest、39 API/浏览器检查、217 前端
  # refresh（ISS-100 起随浏览器 job 执行；ISS-111 权限分区断言 179 → 188；
  # ISS-113 更新无感化 +5：开关关闭回现状 1、后台下载呈现与取消 1、重试
  # 下载 1、downloaded ready 与确认取消 1、确认安装至 installed 1；
  # available/浏览器降级断言原地改写不计数；ISS-115 权限错误行/历史快照
  # +3、校验歧义 +2，比值断言原地更新不计数；ISS-116 分类显示 +2；
  # ISS-114 滚动边界在 980/1220 两视口各增 4 项；ISS-112 深链按钮
  # hidden 计算样式互斥断言 +4；ISS-118 深链降级 fallback 镜像互斥断言 +2=214；
  # ISS-143 目录详情趋势首/中/末点真实悬停 +3=217）、
  # cargo locked offline build +
  # 单测 67（ISS-100 起随 cargo job 执行；ISS-113 +3：settings.json 宽读
  # fail-safe、prefetch 决策分支、downloaded ready 载荷合同；ISS-113 修复
  # episode 1 +2：预下载独占门门序两钉子——持门期间 install 被拒 busy /
  # CAS 失败放弃不扰动既有门；ISS-114 原生 mask ABI 拒绝路径 +2；
# ISS-110 prepare 期望 pid/导航 URL/失败话术 +3（1 项原地改写）=69；
# ISS-147 后 pytest 1147 = 1109 + 38(tests/test_diff_children.py——绑定
# 历史区间的同级差分 /api/diff/children：任务卡三反例红测 + 分页游标
# 绑定 + 四态行/结构节点 + root=/ 与相似前缀段边界 + HTML/换行目录名 +
# 参数与数据集错误语义 + 同级三序)。
# ISS-152 +29（28+返修 B-1 降级用例 1）：tests/test_storage_discovery.py
# 启动盘容器与卷发现适配器（共享 free 唯一权威/UUID 稳定身份/可见路径
# 归属与 firmlink 去重/卸载锁定未知态/降级三态，plist 结构化输出）。
# ISS-150 +32：tests/test_bigfiles_scoped.py——限定目录的 largest/recent
# 模式与范围约束（两反例 + 越界/竞态/去重/预算披露）。
# ISS-164 +20：tests/test_bigfiles_task_handle.py——大文件查询任务句柄与
# 取消产品入口（句柄确定性与不泄露路径 2 + manager 同键去重/取消/未知句柄
# 2 + API 提交即得句柄/同参同句柄/旧式 409 附句柄 3 + 取消至 cancelled
# 与进程组回收 1 + 双任务互不误伤/幂等/终态如实/保留期 404 4 + 状态对齐与
# 404/400 2 + 写令牌 403 与坏 body 400 与读端点免令牌 3 + 旧式阻塞调用逐
# 字段兼容钉住 1；另 tests/test_api_security.py 白名单登记改动不增减用例）。
  PYTHON_VERSION: "3.14.6"
  NODE_VERSION: "22.22.3"
  RUST_VERSION: "1.88.0"
  PLAYWRIGHT_VERSION: "1.61.1"
  EXPECTED_PYTEST_PASSED: "1297"
  EXPECTED_BROWSER_PASSED: "39"
  EXPECTED_REFRESH_PASSED: "217"
  EXPECTED_ANALYSIS_PASSED: "77"
  # ISS-148 树形同级变化回归（真实 FastAPI+生产页面实点）
  EXPECTED_TREE_PASSED: "74"
  # ISS-151 目录当前大文件回归（真实 FastAPI+生产页面实点）
  EXPECTED_DIR_BIGFILES_PASSED: "36"
  EXPECTED_CARGO_PASSED: "69"

jobs:
  pytest:
    name: pytest (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x86_64 }
    steps:
      - name: 断言原生 runner 架构 ${{ matrix.arch }}
        run: |
          echo "uname -m = $(uname -m)"
          sw_vers
          [ "$(uname -m)" = "${{ matrix.arch }}" ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: 0  # 红态基线演示测试需读历史提交（仓库 ~10MB，全历史代价可忽略）

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装锁定依赖（venv + constraints）
        run: |
          python -m venv "$RUNNER_TEMP/fathom-venv"
          "$RUNNER_TEMP/fathom-venv/bin/python" --version
          "$RUNNER_TEMP/fathom-venv/bin/python" -m pip install \
            -r packaging/requirements-dev.txt -c packaging/constraints.txt

      - name: pytest（断言 1219 项通过）
        env:
          FATHOM_PYTHON: ${{ runner.temp }}/fathom-venv/bin/python
        run: bash scripts/ci_pytest.sh

  api-browser-checks:
    name: API/浏览器检查（arm64）
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: 断言原生 runner 架构 arm64
        run: |
          echo "uname -m = $(uname -m)"
          sw_vers
          [ "$(uname -m)" = "arm64" ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: 0  # 红态基线演示测试需读历史提交（仓库 ~10MB，全历史代价可忽略）

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装锁定依赖（venv + constraints）
        run: |
          python -m venv "$RUNNER_TEMP/fathom-venv"
          "$RUNNER_TEMP/fathom-venv/bin/python" --version
          "$RUNNER_TEMP/fathom-venv/bin/python" -m pip install \
            -r packaging/requirements-dev.txt -c packaging/constraints.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装锁定版本 Playwright 与 chromium
        run: |
          node --version
          npm --version
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm install "playwright@${PLAYWRIGHT_VERSION}"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" --version

      - name: API/浏览器 39 项、前端 refresh 217 项与 AI 解读 77 项检查（断言计数）
        env:
          FATHOM_PYTHON: ${{ runner.temp }}/fathom-venv/bin/python
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PLAYWRIGHT_BIN: ${{ runner.temp }}/pw/node_modules/.bin/playwright
          PW_INSTALL: '1'
        run: bash scripts/ci_browser_checks.sh

  brand-geometry:
    name: 品牌几何一致性（DEC-023 五处同步）
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

        with:

          fetch-depth: 0
      - name: 深度环几何与 favicon 资产一致性
        run: bash scripts/ci_brand_geometry.sh

  cargo-locked:
    name: cargo locked offline（${{ matrix.arch }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x86_64 }
    steps:
      - name: 断言原生 runner 架构 ${{ matrix.arch }}
        run: |
          echo "uname -m = $(uname -m)"
          sw_vers
          [ "$(uname -m)" = "${{ matrix.arch }}" ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: 0  # 红态基线演示测试需读历史提交（仓库 ~10MB，全历史代价可忽略）

      - name: 固定 Rust 工具链 ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version
          [ "$(rustc --version | awk '{print $2}')" = "$RUST_VERSION" ]

      - name: Cargo.lock 锁定离线构建与单测（断言 69 项通过）
        env:
          CARGO_PREFETCH: '1'
        run: bash scripts/ci_cargo_locked.sh

      # ISS-068：壳层插件注册断言（源码 .plugin() + ACL opener/allow-open-url）。
      # 紧跟 cargo build——本步骤读取其上一步刚生成的
      # target/debug/build/*/out/acl-manifests.json；不依赖 .app bundle。
      - name: Tauri opener 插件注册与授权断言
        env:
          # 脚本以 -x 检查解释器路径（不查 PATH），cargo job 无 venv，
          # 用 runner 系统 python3 绝对路径（仅标准库解析 acl-manifests.json）。
          FATHOM_PYTHON: /usr/bin/python3
        run: bash scripts/ci_tauri_opener_registered.sh
