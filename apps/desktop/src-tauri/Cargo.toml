[package]
name = "fathom-desktop"
# 版本必须与单一版本源 fathom/__init__.py __version__ 一致（ISS-037）；
# scripts/check_version_consistency.sh 会拦截漂移。
version = "0.3.1"
license = "Apache-2.0"
description = "Fathom 桌面壳：菜单栏监控 + 主窗口"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# ISS-040B：应用内更新接线。仅这两个新 crate（合同边界，锁版本进 Cargo.lock）。
# - updater：检查/下载/验签/安装（minisign，公钥在 tauri.conf.json plugins.updater；
#   私钥由 CI/PM 发行时经 TAURI_SIGNING_PRIVATE_KEY 注入，绝不入仓库）。
# - process：relaunch（updater_restart 经 request_restart 协调退出与重启）。
# 本机缓存实际解析：updater 2.10.1 / process 2.3.1（合同预估 2.3.1 为旧信息，
# 同属 "2" 线，--locked --offline 门禁不受影响）。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ISS-068：测试用。glob 的匹配语义必须与 tauri-plugin-opener 所解析的
# 同一 crate 一致（upstream scope.rs 用 glob::Pattern::matches），故直接依赖
# 它而非自造匹配。区间与 Cargo.lock 既有 0.3.4 收敛，--locked 不受影响。
[dev-dependencies]
glob = "0.3"

[lib]
name = "fathom_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]
